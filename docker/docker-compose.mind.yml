services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: fly-mind-pgvector
    environment:
      POSTGRES_USER: fly
      POSTGRES_PASSWORD: fly
      POSTGRES_DB: fly_mind
    ports:
      - "5433:5432"
    volumes:
      - fly_mind_pgdata:/var/lib/postgresql/data
      - ./init-mind.sql:/docker-entrypoint-initdb.d/01-init-mind.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fly -d fly_mind"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: fly-mind-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-flymindgraph}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - fly_mind_neo4j_data:/data
      - fly_mind_neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Skill cortex partition: discovered motor programs (separate Community Edition
  # instance — CE has no multi-DB). Place graph stays on neo4j:7687.
  neo4j-skill:
    image: neo4j:5-community
    container_name: fly-mind-neo4j-skill
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_SKILL_PASSWORD:-flymindskill}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - fly_mind_skill_neo4j_data:/data
      - fly_mind_skill_neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Speech cortex partition: utterances + alphabet + eye images (CE has no multi-DB).
  neo4j-speech:
    image: neo4j:5-community
    container_name: fly-mind-neo4j-speech
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_SPEECH_PASSWORD:-flymindspeech}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7476:7474"
      - "7689:7687"
    volumes:
      - fly_mind_speech_neo4j_data:/data
      - fly_mind_speech_neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fly_mind_pgdata:
  fly_mind_neo4j_data:
  fly_mind_neo4j_logs:
  fly_mind_skill_neo4j_data:
  fly_mind_skill_neo4j_logs:
  fly_mind_speech_neo4j_data:
  fly_mind_speech_neo4j_logs:
