behaviors:
  FlyAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory: null
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
# Phase 9 architecture B notes:
# - Enable FlyAgent.includeMotorGoalsInObs (obs = 197 body + 5 goal = 202)
# - Enable FlyAgent.useLocomotionReward; set useWalkingDemo=false
# - Goals are sampled on episode begin; actions track those setpoints
env_settings:
  env_path: ../../builds/FlyChamber
  env_args: null
  base_port: 5005
  num_envs: 1
  seed: 42
engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
checkpoint_settings:
  run_id: fly_walk_ppo
  initialize_from: null
  load_model: false
  resume: false
  force: false
  append_experiment_name: false
debug: false
