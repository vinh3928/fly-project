seed: 42
experiment_id: experiment_mind_000001
fly_id: fly_001

database:
  # Override with FLY_MIND_DSN
  dsn: "postgresql://fly:fly@127.0.0.1:5433/fly_mind"
  schema: fly_mind
  # Use in_memory when Postgres is unavailable (tests / local smoke)
  backend: in_memory  # in_memory | pgvector

embedding:
  latent_dim: 256
  affect_dim: 16
  # latent_dim + affect_dim stored in pgvector
  total_dim: 272
  body_dim: 85
  chemical_dim: 64
  internal_dim: 8
  vision_size: 64

stm:
  top_k_similar: 5
  recent_k: 8
  max_rows_per_fly: 5000

affect:
  weights:
    sugar_to_joy: 1.0
    bitter_to_anger: 0.8
    bitter_to_fear: 0.6
    energy_to_survival: 1.0
    instability_to_surprise: 1.0
    hunger_to_sad: 0.5
    damage_to_fear: 0.7

llm:
  # OpenAI-compatible; set OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  timeout_seconds: 30
  # When true (default for tests), use heuristic devil's advocate without HTTP
  mock: true

thinking:
  decision_hz: 20
  action_clamps:
    forward_max: 1.0
    turn_max: 1.0
    height_default: 0.5
    frequency_default: 0.5
    survival_forward_scale: 0.25

live:
  max_steps: 200
  use_fake_env: false
