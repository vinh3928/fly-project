seed: 42
experiment_id: experiment_mind_000001
fly_id: fly_001

database:
  # Override with FLY_MIND_DSN
  dsn: "postgresql://fly:fly@127.0.0.1:5433/fly_mind"
  schema: fly_mind
  # Multi-vector STM in fly_mind.short_term_memory (pgvector).
  # Tests should pass backend=in_memory explicitly; live runs use pgvector.
  backend: pgvector # in_memory | pgvector

# Spatial mental map. Place nodes and their four Wall nodes live in Neo4j;
# pgvector remains the short-term-memory backend.
place_graph:
  enabled: true
  backend: neo4j # in_memory | neo4j
  uri: "bolt://127.0.0.1:7687"
  user: neo4j
  password: flymindgraph # override with NEO4J_PASSWORD
  database: neo4j
  view_dim: 60 # PATCH_VEC_DIM: 6 hexagonal facets × 5 features × 2 eyes
  match_min: 0.97
  update_every: 1 # upsert place from stereo patch_vec every N steps
  familiarity_bump: 0.12 # per revisit bump on each Wall / item
  # Path/reference disambiguation: same view from different previous places
  # creates distinct Place nodes linked by ADJACENT edges.
  context_enabled: true
  context_top_k: 8
  # Break same_place when novelty / landmarks change even if patch cosine still
  # matches (open meadow otherwise glues one Place and route_home stalls).
  split_on_novelty: true
  novelty_split_min: 0.25
  split_on_landmark: true
  opening_delta_min: 0.15
  wall_delta_min: 0.15
  # Sensor feedback (MappedSensorFeedback): once a wall/odor/taste item is
  # mapped on the current Place in Neo4j, the *reported* sensor channel is
  # scaled by max(floor, 1 - strength * item_familiarity). Raw transducers
  # stay available as wall_hazard_raw / odor_raw / …
  hazard_decay_strength: 0.85
  hazard_decay_floor: 0.15
  # Two-layer Neo4j cache: L1 (10s) stop-on-hit — no Bolt round-trip;
  # L2 (24h) after L1 miss — save L1 + L2 + Neo4j.
  # Place identity is mean-centered + L2-normalized patch_vec (raw cosine on
  # nonneg patches collapses the chamber into one node).
  cache:
    enabled: true
    dir: "logs/place_cache"
    l1_ttl_seconds: 10
    l2_ttl_seconds: 86400
    match_min: 0.97
    l1_persist_every: 1.0
    neo4j_flush_every: 5.0 # seconds; durable save of the place the fly keeps revisiting

# Skill cortex: separate Neo4j (Bolt 7688) for discovered motor programs
# (open primitive combos). Babble proposes anonymous candidates; HITL/Father names.
skill_cortex:
  enabled: true
  backend: neo4j # in_memory | neo4j
  uri: "bolt://127.0.0.1:7688"
  user: neo4j
  password: flymindskill # override with NEO4J_SKILL_PASSWORD
  database: neo4j
  babble:
    enabled: true
    min_novelty: 0.35
    max_survival_risk: 0.45
    max_hunger: 0.55
    cooldown_steps: 200
    max_steps: 8
    min_steps: 3
    duration_range: [8, 24]
  promote_min_score: 0.4
  # Auto Ask-LLM when Display 4 is not focused (Unity also self-triggers when away).
  auto_llm_away_seconds: 0.1

embedding:
  latent_dim: 256
  affect_dim: 16
  # latent_dim + affect_dim stored in pgvector
  total_dim: 272
  body_dim: 85
  chemical_dim: 64
  internal_dim: 8
  vision_size: 64
  vision_channels: 3 # RGB eyes (Unity CameraSensor Grayscale=false)

stm:
  top_k_similar: 5
  recent_k: 8
  max_rows_per_fly: 5000

affect:
  weights:
    sugar_to_joy: 1.0
    bitter_to_anger: 0.8
    bitter_to_fear: 0.6
    energy_to_survival: 1.0
    instability_to_surprise: 1.0
    hunger_to_sad: 0.5
    damage_to_fear: 0.7

llm:
  # Devil's advocate against a LOCAL *text* Ollama model (not OpenAI, not the vision model).
  # qwen2.5vl:7b is for visual_thinking only — using it here costs ~10-15s/call.
  #   ollama pull llama3.2:3b
  # Env overrides still work: OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL.
  base_url: "http://127.0.0.1:11434/v1"
  model: "llama3.2:3b"
  api_key: "ollama" # Ollama ignores it; the OpenAI-style client sends one
  timeout_seconds: 20
  max_tokens: 120 # enough for the full JSON proposal without truncation
  temperature: 0.3
  keep_alive: "10m" # keep model warm between mind ticks
  # When true, use the heuristic devil's advocate without HTTP (tests / offline).
  mock: false
  # Critique is requested every mind tick, so refresh off-thread and reuse the
  # newest reply instead of blocking the sim loop on the model.
  background: true

thinking:
  decision_hz: 20
  action_clamps:
    forward_max: 1.0
    turn_max: 1.0
    height_default: 0.5
    frequency_default: 0.5
    survival_forward_scale: 0.35
  # Lower ⇒ sugar/novelty/hunger peaks fire sooner → walk/forage plans.
  # Wall is higher so textured grass / distant clutter outside does not peak as a wall.
  stimulus_thresholds:
    bitter: 0.2
    sugar: 0.15
    wall: 0.45
    survival: 0.35
    low_energy: 0.55
    hunger: 0.25 # earlier than hard seek — Present/L1 notice rising hunger
    novelty: 0.22
  enable_retrospective: true

# Phase 7: two-layer next-state + low-load retrospective
world_model:
  latent_dim: 256
  action_dim: 5
  hidden_dim: 512
  checkpoint_path: checkpoints/world_model.pt
  rollout_horizon: 2
  priorities:
    age_horizon: 500
    data_horizon: 100
    max_altruism: 0.35
    max_spiritual: 0.35
    min_survival: 0.3
  retrospective:
    survival_risk_max: 0.45
    bitter_max: 0.35
    wall_hazard_max: 0.45
    batch_size: 8
    wm_train_steps: 1
    wm_lr: 0.001
    investigate_interest: true

live:
  max_steps: 200
  use_fake_env: false
  console_log: true
  console_log_every: 1 # every decision step; mind text is included on motor ticks too
  console_log_verbose: false # set true or pass -v for full MIND* DETAIL JSON lines

# Phase 9 architecture B: mind pushes act directives; motor tracks until next push.
motor:
  enabled: true
  mind_interval: 40 # sync mode only: think every N motor steps
  # Async mind: thoughts run on a background worker; the motor acts every step and
  # never waits. A new stimulus (stimulus interrupt) discards the in-flight thought,
  # holds the fly still, and deep-thinks on the stimulus until a reframed thought lands.
  async_mind: true
  async_min_steps: 4 # minimum motor steps between submitted thoughts
  async_reframe_max_steps: 400 # max extra freeze waiting for the reframed deep thought
  act_state_enabled: true # act_anything / still / idle via mind push (no motor poll)
  mode: heuristic # heuristic | learned
  smoothing: 0.55
  max_delta: 0.75
  min_forward: 0.4
  checkpoint_path: checkpoints/motor_policy.pt
  obs_dim: 197
  goal_dim: 5
  action_dim: 5

# Phase 8: curiosity-driven exploration (novelty + prediction error, homeostatic gates)
curiosity:
  enabled: true
  curiosity_weight: 0.8
  novelty_weight: 0.55
  prediction_weight: 0.45
  reward_cap: 1.0
  survival_risk_max: 0.7
  hunger_max: 0.7
  energy_min: 0.25
  explore_action_boost: 0.45
  explore_candidate_bonus: 0.22
  latent_dim: 256
  action_dim: 5
  novelty:
    grid_cell_size: 0.1
    first_visit_bonus: 1.0
    repeat_decay: 0.85
    arena_half_extent: 0.25
    # Experience novelty: full 256-d fused embedding, normalized per dimension
    # (running mean/spread), mean RMS z-distance to the knn nearest of the last
    # memory_size embeddings (skipping the newest recent_exclude), then scaled by
    # the run's own distances: baseline_percentile → 0, percentile → 1.
    # Unity sends no position, so this replaces the missing spatial term (0.45).
    experience_weight: 0.6
    experience_new_threshold: 0.5
    experience:
      memory_size: 1000
      knn: 5
      recent_exclude: 8
      history_size: 500
      percentile: 95
      baseline_percentile: 50
      warmup: 20

# Stimulus-agnostic: rises when thoughts repeat and/or body stays still; forces turn+crawl.
boredom:
  enabled: true
  thought_weight: 0.55
  physical_weight: 0.55
  thought_horizon_ticks: 3
  physical_horizon_steps: 10
  motion_eps: 0.002
  action_eps: 0.08
  force_threshold: 0.55
  stop_penalty: 0.35
  locomotor_bonus: 0.22
  escape_forward: 0.45
  escape_turn: 0.55
  # Blocked: forward >= blocked_forward_min, wall_hazard >= blocked_wall_min, and
  # body still (pose Δ < motion_eps, else speed < blocked_speed_max) for
  # blocked_horizon_steps → back up (escape_backup) and turn for escape_hold_steps.
  # Open space (wall≈0) never arms escape. While blocked, wall stays raw (no fade).
  blocked_forward_min: 0.3
  blocked_speed_max: 0.01
  blocked_wall_min: 0.25
  blocked_horizon_steps: 200
  escape_hold_steps: 160
  escape_backup: 0.5

# Hungry sugar search: compare sugar smell across mind ticks.
# Rising → gentle antenna steering; flat → turn harder each tick (base + step·n,
# capped); sharp drop → near U-turn. Side comes from antenna bearing, else the
# last side. Resets when not hungry or no sugar smell.
# When hungry outside (or multi-hop from home), follow ADJACENT place memory
# back into the box before sugar chemotaxis. Home = sugar puddle if known,
# else the chamber place left when first stepping outside.
route_home:
  enabled: true
  max_hops: 64
  handoff_sugar_min: 0.35
  cruise_forward: 0.55
  pivot_turn: 0.8
  # Hold one turn direction until ≥180° AND hops drop (cap 360° if thrashing).
  min_turn_degrees: 180
  max_turn_degrees: 360
  commit_turn: 0.8
  commit_forward_min: 0.3 # crawl while committed (avoid fwd=0 spin lock)
  commit_escape_ticks: 2 # soft-steer after max yaw with no hop progress
  commit_escape_turn: 0.55 # below pivot_turn so escape keeps forward
  deg_per_unit_turn: 90 # mind_interval≈20; use ~183 if mind_interval is 40
  bookmark_sugar_smell: 0.25 # bookmark enclosed puddle/place only (not outdoor plume)
  trail_plume_home: true # reverse-path to session outdoor/odor_plume smell peaks
  trail_plume_smell_min: 0.25 # ignore weak outdoor smell when picking plume trail
  max_opening_for_home: 0.4 # reject meadow/tunnel-mouth views as food/chamber home
  # Steer toward next place's Unity world_xyz as a checkpoint (falls back to edge
  # turn if unmapped). Arriving within world_arrive_m advances even if place-id
  # rematch minted a new outdoor node (keeps hops from climbing forever).
  world_steer: true
  world_steer_gain: 1.0
  world_arrive_m: 0.08
  # Session smell trail: when hungry, reverse-path to last strong enclosed smell;
  # rising smell blends antenna bearing; walls outside steer toward openings.
  trail_max: 64
  trail_smell_min: 0.08
  rise_eps: 0.002
  smell_blend: 0.55
  wall_avoid: 0.45
  entrance_opening_min: 0.25
  wall_path_penalty: 1.5 # Dijkstra: avoid high-wall places when routing around
  opening_path_bonus: 0.75 # prefer edges that recorded a tunnel/opening
  # Hungry: query Neo4j for sugar / sugar_smell only (ignore generic odor plumes)
  # and follow ADJACENT nodes+edges back to the earliest sugar experience.
  graph_food_enabled: true
  graph_food_min: 0.05
  prefer_first_food: true
  # No home / unreachable / missing edge → body spins 360° in 20° steps;
  # Unity yaws the thorax and keeps the head leading ~one step.
  landmark_scan: true
  scan_step_degrees: 20
  scan_span_degrees: 360
  scan_turn: 0.12
  scan_landmark_opening: 0.35
  scan_landmark_novelty: 0.25

sugar_search:
  enabled: true
  rise_eps: 0.002 # relative smell gain per mind tick that counts as closer
  sharp_drop: 0.05 # relative loss per mind tick that triggers reverse
  base_turn: 0.25
  turn_step: 0.1
  max_turn: 0.75
  reverse_turn: 1.0
  bearing_min: 0.05
  # Per-motor-step orient reflex: turn = steer_gain·bearing every step (not just
  # mind ticks); forward = cruise·(1 − |turn|/pivot_turn). Sharp angles pivot
  # in place for pivot_max_ticks, then crawl at ≥align_go_forward while turning
  # (align, then go — avoids forever-spin on saturated ±1 bearings).
  # Antenna tips are 38 mm apart ⇒ bearing ≈ 1.75·sin(angle); pivot beyond ~27°.
  orient_enabled: true
  steer_gain: 1.0
  cruise_forward: 0.6
  pivot_turn: 0.8
  pivot_max_ticks: 12
  align_go_forward: 0.35
  # Arrive + feed: extend proboscis and slow once smell ≥ probe_smell; on sugar
  # (feet or proboscis taste ≥ feed_taste_min) stop the motor for a feed bout of
  # feed_ticks motor ticks (= mind_interval). Repeats while the proboscis tastes
  # sugar and the fly is hungry. Hungry / food-seek at energy < 0.55 (hunger ≥ 0.45),
  # matching Layer-1 low_energy; once a feed bout starts, feeding continues until
  # energy ≥ 0.9 (composer.ENERGY_SATED).
  probe_smell: 0.6
  probe_extension: 1.0
  arrive_slow: 0.6
  feed_taste_min: 0.2
  feed_ticks: 40

# Safe-mode default drive: juvenile → curiosity/explore; adult → sex/court; shaped by outcomes.
tendency:
  enabled: true
  juvenile_curiosity: 0.85
  juvenile_sex: 0.05
  juvenile_forage: 0.10
  adult_curiosity: 0.35
  adult_sex: 0.45
  adult_forage: 0.20
  outcome_lr: 0.08
  base_bonus: 0.06
  safe_mode_bonus: 0.30

# Eye novelty: each eye is a pointy-top hexagon split into 6 triangles
# (diagonals through the center). Pixels outside the hex are masked.
# Scalar viz / bearing used by motor+interrupt = peak facet (argmax), not a blend.
visual_novelty:
  enabled: true
  facet_count: 6
  grid_rows: 1 # legacy alias (hex facets use facet_count)
  grid_cols: 6
  first_visit_bonus: 1.0
  repeat_decay: 0.7
  change_weight: 0.45
  novelty_weight: 0.55
  turn_gain: 0.85
  forward_gain: 0.55
  min_novelty_for_pull: 0.18
  eye_bearing_offset: 0.2 # left eye shifts bearing left; right shifts right
  # Habituation is per-facet: a static triangle loses novelty; change recovers it.
  habituation_enabled: true
  static_change_threshold: 0.08 # facet change below this ⇒ "same view"
  habituation_rate: 0.02 # slow decay toward habituated when static (~50 ticks)
  dishabituation_rate: 0.5 # fast recovery when the facet changes
  habituation_strength: 0.9 # up to 90% of novelty suppressed when fully habituated

# Novelty-triggered vision-LLM "thinking mode": when the eyes see something
# novel during low cognitive load, stop to think against a LOCAL vision LLM
# (Ollama, not OpenAI). Runs off the hot path so the motor keeps ticking.
#   Recommended models:  qwen2.5vl:7b (best), qwen2.5vl:3b / moondream (light).
#   Enable Ollama:  set enabled: true, mock: false, and run `ollama pull qwen2.5vl:7b`.
visual_thinking:
  enabled: true # novelty → low-load vision-LLM think via Ollama
  mock: false # false = call Ollama; true = offline heuristic
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen2.5vl:7b"
  api_key: "ollama" # Ollama ignores it; the OpenAI-style client sends one
  timeout_seconds: 30
  # Gating: only "stop to think" when safe and worthwhile.
  min_visual_novelty: 0.45
  require_new_stimulus: false
  max_wall_hazard: 0.6
  max_survival_risk: 0.5
  cooldown_ticks: 40
  image_size: 128
  # Motor influence.
  inspect_forward_scale: 0.2 # damp forward while thinking (stop & look)
  inspect_turn_gain: 0.6 # orient toward the stimulus while thinking
  insight_ttl_ticks: 40 # how long an "approach" insight pulls the goal

# Seeded personality — judgement reads a live snapshot every mind tick.
# Later systems rewrite these via pipeline.personality.adjust / set_traits.
personality:
  risk_appetite: 0.45 # 0 = averse .. 1 = seeking
  playfulness: 0.55
  curiosity_to_test: 0.70
  intelligence: 0.50
  wisdom: 0.30

# Trait-weighted judgement of structured devil proposals → motor blend.
# acknowledge = park as interest point for low-load investigation (no motor blend).
judgement:
  enabled: true
  reconsider_budget: 1
  reject_memory_ticks: 80
  base_blend_weight: 0.30
  max_blend_weight: 0.60
  accept_threshold: 0.05
  reject_threshold: 0.20
  ignore_weak_confidence: 0.2
  acknowledge_threshold: 0.18
  acknowledge_novelty_min: 0.15
  acknowledge_load_min: 0.45
  acknowledge_eye_match_max: 0.4

# Father advocate: on stimulus interrupt, ask a teaching question before devil
# deep-thought. Unity Display 3 shows a textbox (human reply or Ask LLM).
# Lessons reinforce future interrupts with the same cue.
father_advocate:
  enabled: true
  # human_or_llm = Unity popup; llm = auto-answer (fake/headless / CI)
  mode: human_or_llm
  # Motor hard-stops until Reply / Ask LLM / Skip, or this many seconds → auto LLM.
  timeout_seconds: 60
  max_question_chars: 220
  max_answer_chars: 420
  mock: null # null = inherit llm.mock; true/false overrides
  max_lessons: 64

# Interrupt Architecture-B: novel cue → hard motor freeze + deep-thought stub.
# Freeze lasts deep_thought_steps; mind ticks every deep_thought_mind_interval
# (default 4) run devil LLM on heightened (×deep_thought_gain) senses with no
# motor output. STM save on clear.
stimulus_interrupt:
  enabled: true
  # STM smell-novelty / visual / taste cue → L1 joint retrieval + cue-column gate.
  # Retrieve top-k by joint_vec; compare only the column that opened the cue
  # (patches | smell | sensors). L2 whole-joint familiarity deferred.
  # On clear (end of freeze), save patch_vec, smell_vec, sensors_vec, and joint_vec.
  history_backend: joint
  joint_neighbors: 8
  joint_match_min: 0.92 # reserved for future L2
  patch_match_min: 0.92 # L1 when cue is visual_novelty / new_stimulus
  sensors_match_min: 0.92
  smell_enabled: true
  smell_match_min: 0.92 # smell cue probe + L1 when cue is smell_novelty
  smell_neighbors: 8
  patch_grid_rows: 1 # legacy; hexagonal eyes use 6 facets (see visual_novelty.facet_count)
  patch_grid_cols: 6
  min_visual_novelty: 0.18
  cooldown_steps: 20
  deep_thought_steps: 80
  deep_thought_gain: 10.0
  deep_thought_mind_interval: 4 # mind+devil every 4 steps while frozen (vs mind_interval 40)
  # Rising-edge hunger / low_energy / survival → freeze + deep reframe (no STM novelty).
  # Suppressed while route_home is in progress (do not freeze mid-return path).
  status_reframe_enabled: true
  status_deep_thought_steps: 40 # shorter freeze than novelty inspect; null = same as deep_thought_steps
  # Hazard conditioning during deep thought: hits to mark a risk conditioned;
  # consecutive agreeing accept/acknowledge judgements early-unlock the freeze.
  conditioning_hit_threshold: 3
  judgement_confirmations: 2
  # Passive smell: cheap in-memory antenna watcher (no STM touch) that gates the
  # STM smell probe. Backed by generic ModalChangeGate (reusable for vision /
  # sensors with ttl_seconds=10 L1 sample-and-diff).
  passive_smell_enabled: true
  passive_smell_interval: 4 # sample antenna every N steps
  passive_smell_change_min: 0.05 # per-channel delta that counts as a change
  passive_smell_refresh_ms: 500.0 # forced probe cadence when nothing changes
  passive_smell_ttl_seconds: 0.0 # optional wall-clock cadence (0 = step-only)
  # Legacy STM-CNN backend knobs (only when history_backend: stm):
  history_relative: true
  history_baseline_window: 40
  history_relative_drop: 0.04
  history_min_baseline_samples: 8
  history_bootstrap_baseline: 1.0
  history_match_min: 0.55
  modalities: [left_eye, right_eye, sensors]
  # Soft low-load gate uses world_model.retrospective survival/bitter caps
  # (wall alone does not block — otherwise interrupts starve facing walls).

# Deferred interest points: judgement acknowledge → STM-linked queue →
# low-load retrospective pops and investigates (slow + turn toward bearing).
interest:
  enabled: true
  max_pending: 32
  ttl_ticks: 800
  investigate_per_low_load: 1
  min_novelty_to_enqueue: 0.12
  investigate_forward_scale: 0.25
  investigate_turn_gain: 0.7
  investigate_ttl_ticks: 40
  merge_bearing_tol: 0.25
  eye_store_size: 32 # downsample each eye snapshot to NxN
  max_eye_archives: 64 # keep this many acknowledge eye pairs
  acknowledge_eye_match_max: 0.4
