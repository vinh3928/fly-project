seed: 42
vision_size: 64
latent_dim: 128
hidden_dim: 128

train:
  steps: 200
  batch_size: 32
  learning_rate: 0.001
  device: cpu
  checkpoint_path: ../data/checkpoints/vision_head.pt

# Unity eye frames + ray labels from Tools → Fly → Record Vision Dataset.
# python -m scripts.train_vision_head --unity  (writes train.checkpoint_path)
unity_train:
  dataset_dir: ../data/vision_unity
  epochs: 15
  batch_size: 64
  learning_rate: 0.001
  val_fraction: 0.1

arena:
  half_extent: 0.45
  success_radius: 0.08
  eval_steps: 120
  max_wall_collisions: 3

live:
  use_vision_head: true
  use_heuristic_if_untrained: true
  wall_hazard_forward_scale: 0.2
