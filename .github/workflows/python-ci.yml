name: python-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check flybrain tests scripts
      - name: Black
        run: black --check flybrain tests scripts
      - name: Pytest
        run: pytest -q
      - name: Smoke exchange
        run: python -m scripts.smoke_exchange
      - name: Phase 0-8 benchmark
        run: python -m scripts.run_phase_benchmark --check --self-check
